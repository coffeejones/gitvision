[project]
name = "gitvision-eval"
version = "0.1.0"
description = "A/B evaluation harness for GitVision MCP — internal roadmap input"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["eval"]
