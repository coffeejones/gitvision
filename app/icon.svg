       active-tab background blends with the off-white Baron fill, making
       the favicon look like a white square when the tab is active. The
       dark background guarantees consistent contrast on any tab color
       (active or inactive, light or dark mode). The rounded radius keeps
       it feeling like a brand stamp rather than a hard tile. -->
