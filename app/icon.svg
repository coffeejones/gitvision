<!--
  App favicon — Baron mascot (v0.80, replaces the old ImageResponse-
  based icon.tsx that Satori couldn't render correctly with this
  evenodd-filled multi-subpath shape).

  Next.js 13+ auto-routes app/icon.svg to /favicon.ico and emits the
  appropriate <link rel="icon"> tags. Static SVG is rendered by the
  browser directly (no Satori involved), so the complex fill-rule
  works.

  Fill is off-white (TOK.textPrimary #E8E8EE) to match the rest of
  the brand mark after the move away from emerald.
-->
